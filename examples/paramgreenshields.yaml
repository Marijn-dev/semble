dynamics:
  name: ParameterisedGreenshieldsTraffic
  args:
    n: &n 200
    dx: 0.01
    parameter_generator:
      parameter_generator:
      name: Product
      args:
        # coeff 1
        - name: Gaussian
          args:
            mean: 0.95
            std: 0.007
        # coeff 2 
        - name: Gaussian
          args: 
            mean: -0.07
            std: 0.007
        # coeff 3
        - name: Gaussian
          args:
            mean: 0.01
            std: 0.002
        # coeff 4
        - name: Gaussian
          args:
            mean: 0.07
            std: 0.007
       # coeff 5
        - name: Gaussian
          args:
            mean: -0.03
            std: 0.003

sequence_generator:
  name: UniformSqWave
  args:
    period: 1
    min: 0.
    max: 0.5

initial_state_generator:
  name: GreenshieldsInitialState
  args:
    n_cells: *n
    n_sections: 8

control_delta: 1.0
